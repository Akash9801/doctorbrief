services:
  - type: web
    name: doctorbrief-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctorbrief-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: OPENAI_CLINICAL_MODEL
        value: gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: doctorbrief-db
    databaseName: doctorbrief
    user: doctorbrief
